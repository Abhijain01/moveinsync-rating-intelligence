name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Require original submission evidence
        run: |
          test -f data/processed/run_20261010T203205Z/reviews_clean.csv
          test -f data/raw/run_20261010T203205Z/manifest.json
      - run: python -m pytest -ra
